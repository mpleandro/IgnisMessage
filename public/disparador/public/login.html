<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Disparador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--fg:#f7f5ef;--muted:#aaa8a2;--orange:#ff6b1a;--line:#ffffff20;--danger:#ff5a4d;--font:Manrope,Arial,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);padding:16px;
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),#ffffff0b calc(20% - 1px),#ffffff0b 20%)}
::selection{background:var(--orange);color:#080808}
form{width:100%;max-width:400px;border:1px solid var(--line);background:#0b0b0b;padding:38px 32px}
form img{width:150px;height:auto;margin-bottom:34px}
h1{margin:0 0 8px;text-transform:uppercase;font-size:34px;font-weight:800;line-height:1;letter-spacing:-.07em}
h1 span{color:transparent;-webkit-text-stroke:1px var(--orange)}
p{margin:0 0 28px;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
label{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
input{display:block;width:100%;margin-top:8px;padding:13px 14px;color:var(--fg);background:#0d0d0d;border:1px solid var(--line);border-radius:0;font:400 15px var(--font);letter-spacing:0;text-transform:none}
input:focus{outline:0;border-color:var(--orange)}
button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:15px 24px;border:1px solid var(--orange);background:var(--orange);color:#080808;font:800 11px/1.3 var(--font);letter-spacing:.035em;text-transform:uppercase;cursor:pointer;transition:background .25s}
button:after{content:'↗';font-size:22px;font-weight:500}
button:hover{background:#ff8d50}button:disabled{opacity:.6;cursor:wait}
#err{color:var(--danger);font-size:13px;min-height:20px;margin:0 0 12px}
</style>
</head>
<body>
<form id="f">
  <img src="assets/ignis-horizontal.png" alt="Método Ignis" width="150" height="40">
  <h1>Disparador <span>WhatsApp</span></h1>
  <p>Entre para continuar</p>
  <label>Usuário <input name="user" autocomplete="username" required autofocus></label>
  <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
  <div id="err" role="alert"></div>
  <button id="b">Entrar</button>
</form>
<script>
const f=document.getElementById('f'),err=document.getElementById('err'),b=document.getElementById('b');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';b.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:f.user.value.trim(),password:f.password.value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok)location.href='/';else err.textContent=d.error||'Falha ao entrar.';
  }catch{err.textContent='Erro de conexão.'}
  b.disabled=false;
});
</script>
</body>
</html>
